<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Richiesta Inviata - P.A. Nicosia O.d.V.</title>
    
    <link rel="icon" type="image/png" href="Logo.PNG">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        /* 1. VARIABILI DI TEMA (LIGHT/DARK) */
        :root {
            --bg-color: #f8f9fa; /* Sfondo leggermente grigio per far risaltare la card */
            --text-color: #1d1d1f;
            --nav-bg: rgba(255, 255, 255, 0.90);
            --nav-border: rgba(0, 0, 0, 0.08);
            --card-bg: #ffffff;
            --card-border: rgba(0, 0, 0, 0.06);
            --secondary-bg: #f5f5f7;
            --text-light: #515154;
            --hover-bg: rgba(230, 92, 0, 0.08);
            --dropdown-bg: #ffffff;
            --bottom-nav-bg: #ffffff;
            --bottom-nav-icon: #8e8e93;
            --bottom-nav-active: #e65c00;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --nav-bg: rgba(18, 18, 18, 0.90);
            --nav-border: rgba(255, 255, 255, 0.1);
            --card-bg: #1e1e1e;
            --card-border: rgba(255, 255, 255, 0.05);
            --secondary-bg: #1a1a1a;
            --text-light: #a0a0a0;
            --hover-bg: rgba(255, 255, 255, 0.1);
            --dropdown-bg: #2d2d2d;
            --bottom-nav-bg: #2d2d2d;
            --bottom-nav-icon: #8e8e93;
            --bottom-nav-active: #e65c00;
        }

        html { scroll-behavior: smooth; scroll-padding-top: 154px; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            overflow-x: hidden; 
            padding-top: 154px; 
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* NAVBAR DESKTOP */
        .glass-nav { background: var(--nav-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--nav-border); transition: all 0.3s ease; }
        .logo-main { height: 137px; width: 137px; border-radius: 50%; object-fit: contain; background: white; padding: 4px; border: 1px solid rgba(0,0,0,0.1); }
        .brand-title { height: 68.5px; display: flex; flex-direction: column; justify-content: center; font-size: 1rem; line-height: 1.2; letter-spacing: -0.2px; color: var(--text-color); margin-left: 15px; }
        .logo-anpas { height: 95px; max-width: 200px; object-fit: contain; }
        .nav-link { color: var(--text-color) !important; font-weight: 600; font-size: 0.95rem; letter-spacing: -0.1px; display: flex; align-items: center; gap: 5px; padding: 0.4rem 0.8rem !important; }
        .nav-link:hover, .nav-link.active { color: #e65c00 !important; }
        .dropdown-menu { background: var(--dropdown-bg); border: 1px solid var(--nav-border); border-radius: 12px; padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        @media (min-width: 992px) { .dropdown:hover .dropdown-menu { display: block; animation: slideFade 0.3s ease forwards; } }
        @keyframes slideFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .dropdown-item { color: var(--text-color) !important; font-size: 0.92rem; padding: 10px 16px; border-radius: 8px; transition: all 0.2s ease; display: flex; align-items: center; gap: 12px; }
        .dropdown-item i { width: 20px; text-align: center; opacity: 0.7; }
        .dropdown-item:hover { background: var(--hover-bg); color: #e65c00 !important; transform: translateX(4px); }
        .dropdown-item:hover i { opacity: 1; color: #e65c00; }

        /* SISTEMA DI IMPAGINAZIONE RESPONSIVE */
        @media (min-width: 992px) {
            .nav-left-wing { flex: 0 0 auto; }
            .nav-center-wing { flex: 1 1 auto; display: flex; justify-content: center; padding: 0 20px; }
            .nav-right-wing { flex: 0 0 auto; }
        }
        @media (min-width: 992px) and (max-width: 1366px) {
            body { padding-top: 121px; } 
            html { scroll-padding-top: 121px; }
            .logo-main { height: 104px; width: 104px; } 
            .brand-title { height: 52px; font-size: 0.80rem; margin-left: 12px; line-height: 1.15; } 
            .logo-anpas { height: 72px; max-width: 150px; } 
            .nav-link { font-size: 0.82rem !important; margin: 0 2px !important; padding: 0.4rem 0.2rem !important; }
            .nav-link i { font-size: 0.82rem; } 
        }

        /* MENU MOBILE (<991px) */
        .bottom-nav { display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 400px; background: var(--bottom-nav-bg); border-radius: 40px; padding: 8px 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); z-index: 1050; border: 1px solid var(--card-border); align-items: center; justify-content: space-between; }
        .bottom-nav-item { color: var(--bottom-nav-icon); text-decoration: none; display: flex; flex-direction: column; align-items: center; font-size: 1.4rem; padding: 8px; transition: all 0.2s; }
        .bottom-nav-item.active { color: var(--bottom-nav-active); transform: translateY(-3px); }
        .bottom-nav-action { background: rgba(230, 92, 0, 0.1); color: #e65c00; border-radius: 20px; padding: 8px 16px; font-size: 0.95rem; font-weight: 600; display: flex; align-items: center; gap: 8px; text-decoration: none; }
        @media (max-width: 991px) { .navbar-collapse { display: none !important; } .bottom-nav { display: flex; } .brand-title { height: auto; line-height: 1.1; flex: 1; text-align: left; } }
        @media (min-width: 768px) and (max-width: 991px) {
            body { padding-top: 107px; padding-bottom: 90px; } 
            html { scroll-padding-top: 107px; }
            .logo-main { height: 90px; width: 90px; padding: 3px; } 
            .brand-title { font-size: 0.85rem; margin-left: 12px; }
            .logo-anpas { height: 60px; max-width: 130px; }
        }
        @media (max-width: 767px) {
            body { padding-top: 77px; padding-bottom: 90px; } 
            html { scroll-padding-top: 77px; }
            .logo-main { height: 60px; width: 60px; padding: 2px; } 
            .brand-title { font-size: 0.85rem; margin-left: 10px; }
            .logo-anpas { height: 45px; max-width: 90px; }
        }

        /* BOTTONI E COMPONENTI */
        .btn-elite-primary { background-color: #e65c00; color: white; border-radius: 50px; padding: 12px 30px; font-weight: 600; border: none; transition: transform 0.2s, box-shadow 0.2s; text-decoration: none; display: inline-block;}
        .btn-elite-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(230, 92, 0, 0.25); color: white; }
        
        .btn-elite-outline { background-color: transparent; color: var(--text-color); border-radius: 50px; padding: 10px 22px; font-weight: 600; font-size: 0.8rem; border: 1px solid var(--text-color); transition: all 0.2s; text-decoration: none;}
        .btn-elite-outline:hover { background-color: var(--text-color); color: var(--bg-color); }

        /* CARD RINGRAZIAMENTO */
        .thank-you-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            padding: 4rem 3rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 700px;
            margin: 0 auto;
        }

        .success-icon-container {
            width: 100px;
            height: 100px;
            background: rgba(40, 167, 69, 0.1);
            color: #28a745;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin: 0 auto 2rem auto;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.5);
        }

        @keyframes popIn {
            to { opacity: 1; transform: scale(1); }
        }

        h1 { font-weight: 800; letter-spacing: -1px; font-size: clamp(2rem, 4vw, 3rem); color: var(--text-color); }
        .testo-leggero { color: var(--text-light); font-weight: 400; font-size: 1.1rem; line-height: 1.6; }
        
        main { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem; }
    </style>
</head>
<body>

    <!-- QUI VERRÀ CARICATA AUTOMATICAMENTE LA NAVBAR DA GLOBAL.JS -->
    <div id="navbar-container"></div>

    <!-- SEZIONE CONFERMA INVIO -->
    <main>
        <div class="container">
            <div class="thank-you-card" data-aos="fade-up" data-aos-duration="800">
                
                <div class="success-icon-container">
                    <i class="fa-solid fa-check"></i>
                </div>
                
                <h1 class="mb-3">Richiesta Inviata!</h1>
                
                <p class="testo-leggero mb-5 mx-auto" style="max-width: 550px;">
                    La tua richiesta è andata a buon fine ed è stata inoltrata correttamente alla nostra segreteria. Il nostro team la prenderà in carico e ti risponderemo il prima possibile.
                </p>
                
                <div class="mt-4 d-flex justify-content-center gap-3 flex-wrap">
                    <a href="index.html" class="btn btn-elite-primary shadow px-5 py-3">
                        <i class="fa-solid fa-house me-2"></i> Torna alla Home Page
                    </a>
                </div>
                
            </div>
        </div>
    </main>

    <!-- QUI VERRÀ CARICATO AUTOMATICAMENTE IL FOOTER DA GLOBAL.JS -->
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init({ once: true, offset: 50 });</script>
    <script src="global.js"></script>
</body>
</html>
